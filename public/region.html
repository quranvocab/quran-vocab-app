<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quranic Vocab — Not available in your region</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#071c2a;--card:#0d2d40;--cyan:#00c8e6;--gold:#ffd96b;--text:#e8f4fa;--muted:#7ab8d4;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
       background:radial-gradient(ellipse 70% 45% at 15% -5%,rgba(0,180,220,.18),transparent),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(255,217,107,.08),transparent),var(--bg);}
  .card{width:100%;max-width:480px;background:var(--card);border:1px solid rgba(0,200,230,.3);border-radius:18px;padding:32px 26px 26px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .ar{font-family:"Scheherazade New",serif;font-size:30px;color:var(--gold);line-height:1.6;margin-bottom:6px;}
  .icon{font-size:42px;margin:4px 0 10px;}
  h1{font-size:22px;margin:0 0 6px;color:var(--text);font-weight:700;}
  .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:18px;}
  p{font-size:15px;line-height:1.7;color:var(--muted);margin:0 0 14px;}
  .ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;font-size:15.5px;line-height:2.2;color:var(--text);margin:18px 0 6px;padding-top:16px;border-top:1px solid rgba(0,200,230,.18);}
  .ur small{display:block;font-size:14px;color:var(--muted);}
  .gold{color:var(--gold);}
  a{color:var(--cyan);text-decoration:none;font-weight:600;}
  .foot{font-size:11.5px;color:rgba(122,184,212,.7);margin-top:18px;}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">🌍</div>
    <div class="brand">Quranic Vocab</div>
    <h1>Currently not available in your region</h1>
    <p>We hope to open it to more regions soon, <span class="gold">in shā' Allāh</span>.</p>
    <div class="ur">
      یہ ایپ فی الحال آپ کے علاقے میں دستیاب نہیں ہے
      <small>ان شاء اللہ جلد ہی دوسرے علاقوں میں بھی دستیاب ہوگی۔</small>
    </div>
  </main>
</body>
</html>
